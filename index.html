<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Clawd Agents</title>
<style>
  :root{
    --clawd: #d97757;
    --clawd-dark: #b95c3c;
    --ink: #191410;
    --fx: #ffd9b5;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  body{
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }

  #stage{
    position: fixed;
    inset: 0;
  }

  /* ---------- 单个 agent ---------- */

  .agent{
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--w, 36px);
    transform: translate(-50%, -50%);
    cursor: pointer;
  }

  .drift{
    position: relative;
    animation: dance var(--dur, 2.4s) ease-in-out infinite;
    animation-delay: var(--delay, 0s);
    will-change: transform;
  }

  @keyframes dance{
    0%   { transform: translate(0px, 0px) rotate(0deg); }
    22%  { transform: translate(var(--sw), -7px) rotate(-4deg); }
    50%  { transform: translate(0px, -2px) rotate(0deg); }
    74%  { transform: translate(calc(var(--sw) * -1), -7px) rotate(4deg); }
    100% { transform: translate(0px, 0px) rotate(0deg); }
  }

  .agent:hover .mascot{ filter: brightness(1.18) saturate(1.1); }

  .mascot{
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .mascot rect{ fill: var(--clawd); }
  .mascot .eye{ fill: var(--ink); }

  .torso, .arm, .leg, .eye{ transform-box: fill-box; }

  .torso{ transform-origin: 50% 100%; }
  .arm{ transform-origin: 50% 50%; }
  .leg{ transform-origin: 50% 0%; }

  .eye{
    transform-origin: 50% 50%;
    animation: blink 5.6s steps(1, end) infinite;
  }
  .eye-r{ animation-delay: .06s; }

  @keyframes blink{
    0%, 93%, 100% { transform: scaleY(1); }
    95%, 97%      { transform: scaleY(.08); }
  }

  /* ---------- 动作：打字 ---------- */

  .act-type .arm-l{ animation: tap .36s ease-in-out infinite alternate; }
  .act-type .arm-r{ animation: tap .36s ease-in-out infinite alternate; animation-delay: -.18s; }
  .act-type .torso{ animation: workBob 1.1s ease-in-out infinite; }

  .act-fast .arm-l{ animation-duration: .2s; }
  .act-fast .arm-r{ animation-duration: .2s; animation-delay: -.1s; }
  .act-fast .torso{ animation-duration: .7s; }

  @keyframes tap{
    from { transform: translateY(0); }
    to   { transform: translateY(-2px); }
  }

  @keyframes workBob{
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-1px); }
  }

  /* ---------- 动作：搬箱子 ---------- */

  .act-carry .arm-l,
  .act-carry .arm-r{ transform: translateY(-3px); }

  .act-carry .torso{ animation: sway 1.9s ease-in-out infinite; }

  @keyframes sway{
    0%, 100% { transform: rotate(-3deg); }
    50%      { transform: rotate(3deg); }
  }

  .crate{
    position: absolute;
    left: 50%;
    top: -8px;
    width: 12px;
    height: 8px;
    margin-left: -6px;
    background: var(--clawd-dark);
    outline: 1px solid #8e4229;
    animation: crateBob 1.9s ease-in-out infinite;
  }

  @keyframes crateBob{
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-2px) rotate(2deg); }
  }

  /* ---------- 动作：敲击 ---------- */

  .act-hammer .arm-r{ animation: hammer .52s cubic-bezier(.4, 0, .5, 1) infinite; }
  .act-hammer .arm-l{ transform: translateY(-1px); }
  .act-hammer .torso{ animation: recoil .52s ease-out infinite; }

  @keyframes hammer{
    0%, 100% { transform: translateY(-3px) rotate(-8deg); }
    45%      { transform: translateY(2px) rotate(8deg); }
  }

  @keyframes recoil{
    0%, 60%, 100% { transform: translateY(0); }
    50%           { transform: translateY(1px); }
  }

  /* ---------- 动作：思考 ---------- */

  .act-think .torso{ animation: lean 2.6s ease-in-out infinite; }
  .act-think .arm-l,
  .act-think .arm-r{ transform: translateY(-1px); }

  @keyframes lean{
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-1px) rotate(2deg); }
  }

  .bubble{
    position: absolute;
    left: 64%;
    top: -12px;
    display: flex;
    gap: 2px;
    padding: 3px;
    background: #1a1512;
    animation: bubbleIn 2.6s ease-in-out infinite;
  }

  .bubble i{
    width: 3px;
    height: 3px;
    background: var(--fx);
    animation: dot 1.2s steps(2, end) infinite;
  }
  .bubble i:nth-child(2){ animation-delay: .18s; }
  .bubble i:nth-child(3){ animation-delay: .36s; }

  @keyframes dot{
    0%, 100% { opacity: .35; }
    50%      { opacity: 1; }
  }

  @keyframes bubbleIn{
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.06); }
  }

  /* ---------- 动作：阅读 ---------- */

  .act-read .arm-l{ transform: translateY(-3px) rotate(-12deg); }
  .act-read .arm-r{ transform: translateY(-3px) rotate(12deg); }
  .act-read .torso{ animation: readBob 3s ease-in-out infinite; }

  @keyframes readBob{
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-1px); }
  }

  .paper{
    position: absolute;
    left: 50%;
    top: 4px;
    width: 14px;
    height: 11px;
    margin-left: -7px;
    background: #f3e7da;
    outline: 1px solid #cbb4a2;
    animation: paperBob 3s ease-in-out infinite;
  }

  .paper::before,
  .paper::after{
    content: "";
    position: absolute;
    left: 2px;
    right: 2px;
    height: 1px;
    background: #b09c8c;
  }
  .paper::before{ top: 3px; }
  .paper::after{ top: 7px; }

  @keyframes paperBob{
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2px); }
  }

  /* ---------- 动作：庆祝 / 跳跃 ---------- */

  .act-cheer .mascot{ animation: hop 1.5s cubic-bezier(.32, 0, .36, 1) infinite; }
  .act-cheer .arm-l{ animation: cheerArm 1.5s ease-in-out infinite; }
  .act-cheer .arm-r{ animation: cheerArm 1.5s ease-in-out infinite .12s; }

  @keyframes hop{
    0%, 55%, 100% { transform: translateY(0); }
    28%           { transform: translateY(-9px); }
  }

  @keyframes cheerArm{
    0%, 55%, 100% { transform: translateY(0); }
    28%           { transform: translateY(-3px) rotate(-14deg); }
  }

  /* ---------- 飘起的小方块 ---------- */

  .fx{
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .bit{
    position: absolute;
    width: var(--bs, 4px);
    height: var(--bs, 4px);
    left: var(--bx, 12px);
    top: -2px;
    background: var(--fx);
    opacity: 0;
    animation: rise var(--pd, 3.4s) linear infinite;
    animation-delay: var(--pdelay, 0s);
  }

  .bit.alt{ background: var(--clawd); }
  .bit.dim{ background: #8a7768; }

  @keyframes rise{
    0%   { opacity: 0;   transform: translateY(6px); }
    14%  { opacity: 1;   transform: translateY(0); }
    68%  { opacity: 1;   transform: translateY(-16px); }
    100% { opacity: 0;   transform: translateY(-24px); }
  }
</style>
</head>
<body>
<div id="stage"></div>

<template id="clawd-tpl">
  <div class="agent">
    <div class="drift">
      <svg class="mascot" viewBox="0 0 12 10" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
        <g class="torso">
          <rect class="body" x="2" y="0.6" width="8" height="7" />
          <rect class="eye eye-l" x="3.6" y="2.4" width="1.3" height="2.6" />
          <rect class="eye eye-r" x="7.1" y="2.4" width="1.3" height="2.6" />
          <g class="arm arm-l"><rect x="0.35" y="3.2" width="1.75" height="1.8" /></g>
          <g class="arm arm-r"><rect x="9.9" y="3.2" width="1.75" height="1.8" /></g>
          <g class="leg leg-1"><rect x="2.52" y="7.6" width="1.35" height="2" /></g>
          <g class="leg leg-2"><rect x="4.39" y="7.6" width="1.35" height="2" /></g>
          <g class="leg leg-3"><rect x="6.26" y="7.6" width="1.35" height="2" /></g>
          <g class="leg leg-4"><rect x="8.13" y="7.6" width="1.35" height="2" /></g>
        </g>
      </svg>
      <div class="fx"></div>
    </div>
  </div>
</template>

<script>
  const params = new URLSearchParams(location.search);

  // ?key=FF00FF —— 桌面悬浮窗用色键抠背景；?bg 仅用于浏览器预览
  const keyColor = params.get('key');
  if (keyColor) {
    const css = keyColor.startsWith('#') ? keyColor : '#' + keyColor;
    document.documentElement.style.background = css;
    document.body.style.background = css;
  } else if (params.has('bg')) {
    document.body.style.background =
      'radial-gradient(circle at 30% 20%, #3b2a24 0%, #241a17 45%, #14100e 100%)';
  }

  // 竖排贴屏幕右侧：7 个 agent，各自的摇摆幅度与节奏都不同
  const AGENTS = [
    { act: 'act-type',          w: 36, sway: 12, dur: 2.4,  delay: 0,    fx: [['4px', 10, ''], ['3px', 20, 'alt']] },
    { act: 'act-fast',          w: 33, sway: 16, dur: 1.9,  delay: -.7,  fx: [['3px', 12, 'alt'], ['4px', 22, '']] },
    { act: 'act-carry',         w: 36, sway: 10, dur: 2.8,  delay: -1.4, fx: [['4px', 14, ''], ['3px', 24, 'dim']] },
    { act: 'act-hammer',        w: 34, sway: 14, dur: 2.1,  delay: -.3,  fx: [['3px', 11, 'alt'], ['3px', 21, ''], ['4px', 5, 'dim']] },
    { act: 'act-think',         w: 32, sway: 18, dur: 3.0,  delay: -2.1, fx: [['3px', 16, 'dim']] },
    { act: 'act-read',          w: 34, sway: 12, dur: 2.6,  delay: -1.1, fx: [['4px', 13, ''], ['3px', 23, 'alt']] },
    { act: 'act-cheer',         w: 36, sway: 15, dur: 1.7,  delay: -.5,  fx: [['4px', 9, 'alt'], ['3px', 19, ''], ['4px', 6, 'dim']] }
  ];

  const stage = document.getElementById('stage');
  const tpl = document.getElementById('clawd-tpl');
  const count = AGENTS.length;

  AGENTS.forEach((config, i) => {
    const node = tpl.content.firstElementChild.cloneNode(true);
    const drift = node.querySelector('.drift');

    node.classList.add(...config.act.split(' '));
    node.dataset.index = i;
    node.style.setProperty('--x', (i % 2 ? 56 : 44) + '%');
    node.style.setProperty('--y', (7 + i * (86 / (count - 1))) + '%');
    node.style.setProperty('--w', config.w + 'px');

    drift.style.setProperty('--sw', (i % 2 ? -config.sway : config.sway) + 'px');
    drift.style.setProperty('--dur', config.dur + 's');
    drift.style.setProperty('--delay', config.delay + 's');

    if (config.act.includes('carry')) {
      const crate = document.createElement('div');
      crate.className = 'crate';
      drift.appendChild(crate);
    }
    if (config.act.includes('read')) {
      const paper = document.createElement('div');
      paper.className = 'paper';
      drift.appendChild(paper);
    }
    if (config.act.includes('think')) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<i></i><i></i><i></i>';
      drift.appendChild(bubble);
    }

    // 像素小方块向上飘，避免文字抗锯齿在色键背景上留下毛边
    const fx = node.querySelector('.fx');
    config.fx.forEach(([size, left, cls], k) => {
      const bit = document.createElement('div');
      bit.className = 'bit ' + cls;
      bit.style.setProperty('--bs', size);
      bit.style.setProperty('--bx', left + 'px');
      bit.style.setProperty('--pd', (2.8 + k * 0.6) + 's');
      bit.style.setProperty('--pdelay', (-k * 1.1) + 's');
      fx.appendChild(bit);
    });

    stage.appendChild(node);
  });

  if (params.has('debug')) {
    requestAnimationFrame(() => {
      const report = [...document.querySelectorAll('.agent')].map((el, i) => {
        const r = el.getBoundingClientRect();
        return `${i}: ${Math.round(r.left)},${Math.round(r.top)} ${Math.round(r.width)}x${Math.round(r.height)}`;
      });
      document.title = `vp ${innerWidth}x${innerHeight} | ` + report.join(' | ');
    });
  }
</script>
</body>
</html>
